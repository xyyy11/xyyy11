<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">xyyy11 — AI agents for data and workflows</title>
  <desc id="d">Banner with the name xyyy11, a tagline, and a four-step pipeline: plan, query, evidence, report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f26"/>
      <stop offset="0.55" stop-color="#12343c"/>
      <stop offset="1" stop-color="#1c4a52"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="730" y1="0" x2="1090" y2="0">
      <stop offset="0" stop-color="#7dd3c0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7dd3c0" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3c0" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)"/>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="64" y="132" font-size="68" font-weight="700" fill="#eaf6f3" letter-spacing="-1">xyyy11</text>
    <text x="66" y="176" font-size="24" fill="#b7dcd4">AI agents for data and workflows</text>
    <text x="66" y="214" font-size="15" fill="#7dd3c0" letter-spacing="1.5">NL2SQL  ·  LANGGRAPH  ·  AGENTS  ·  EVALUATION</text>
  </g>

  <!-- pipeline motif: plan -> query -> evidence -> report -->
  <g>
    <path d="M730 140 H1090" stroke="url(#line)" stroke-width="2"/>
    <g fill="#0b1f26" stroke="#7dd3c0" stroke-width="2">
      <circle cx="750" cy="140" r="16"/>
      <circle cx="850" cy="140" r="16"/>
      <circle cx="950" cy="140" r="16"/>
      <circle cx="1050" cy="140" r="16"/>
    </g>
    <g fill="#7dd3c0">
      <circle cx="750" cy="140" r="5"/>
      <circle cx="850" cy="140" r="5"/>
      <circle cx="950" cy="140" r="5"/>
      <circle cx="1050" cy="140" r="7"/>
    </g>
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#b7dcd4" text-anchor="middle">
      <text x="750" y="186">plan</text>
      <text x="850" y="186">query</text>
      <text x="950" y="186">evidence</text>
      <text x="1050" y="186">report</text>
    </g>
  </g>
</svg>
